[project]
name = "jev-local"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.32.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
bench = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]
